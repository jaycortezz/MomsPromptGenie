<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Prompt Genie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #fbf6f1;
    --card: #ffffff;
    --ink: #3a2f3b;
    --muted: #7a6d78;
    --line: #ecdfd6;
    --accent: #b8506f;
    --accent-dark: #93395a;
    --accent-soft: #fbe8ee;
    --accent-ink: #ffffff;
    --honey: #e9b949;
    --honey-soft: #fdf5e2;
    --good: #3f8f6b;
    --radius: 18px;
    --soft-bg: #fcfaf8;
    --done-bg: #f6fbf8;
    --done-line: #cfe7da;
    --done-badge: #dcefe4;
    --honey-ink: #7a5610;
    --honey-line: #f3e2b8;
    --toast-ink: #ffffff;
    --sw-line: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1d1820; --card: #26202a; --ink: #f1e9ee; --muted: #b3a6b0; --line: #3d3340;
    --accent: #e07d9c; --accent-dark: #f0a3bb; --accent-soft: #432a36; --accent-ink: #1d1820;
    --honey: #e9b949; --honey-soft: #3a3020; --good: #7cc8a3;
    --soft-bg: #221c25; --done-bg: #1f2a25; --done-line: #33493e; --done-badge: #2c4237;
    --honey-ink: #ecd29a; --honey-line: #574828; --toast-ink: #1d1820; --sw-line: rgba(255,255,255,.15);
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #1d1820; --card: #26202a; --ink: #f1e9ee; --muted: #b3a6b0; --line: #3d3340;
    --accent: #e07d9c; --accent-dark: #f0a3bb; --accent-soft: #432a36; --accent-ink: #1d1820;
    --honey: #e9b949; --honey-soft: #3a3020; --good: #7cc8a3;
    --soft-bg: #221c25; --done-bg: #1f2a25; --done-line: #33493e; --done-badge: #2c4237;
    --honey-ink: #ecd29a; --honey-line: #574828; --toast-ink: #1d1820; --sw-line: rgba(255,255,255,.15);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 "Nunito", system-ui, sans-serif; }
  h1, h2, .brand { font-family: "Fraunces", Georgia, serif; }
  button { font: inherit; color: inherit; }

  .top { max-width: 1180px; margin: 0 auto; padding-block: 18px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  .brand { font-size: 1.5rem; font-weight: 700; margin: 0; }
  #stepper { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; }
  #stepper button {
    display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 6px 10px 6px 6px;
    border-radius: 999px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  #stepper button:disabled { cursor: default; opacity: .55; }
  #stepper .dot { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; background: var(--line); color: var(--ink); }
  #stepper .reachable .dot { background: var(--accent-soft); color: var(--accent); }
  #stepper .current { background: var(--accent-soft); color: var(--accent-dark); }
  #stepper .current .dot { background: var(--accent); color: var(--accent-ink); }

  .layout { max-width: 1180px; margin: 0 auto; padding-block: 12px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  #main h1 { font-size: clamp(1.7rem, 4vw, 2.2rem); margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 8px; max-width: 60ch; }
  .label { font: 800 12px "Nunito", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-dark); margin: 24px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
  .label small { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted); }
  h2.section { font-size: 1.5rem; margin: 32px 0 4px; padding-top: 24px; border-top: 1px solid var(--line); }
  .note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .grid.kits { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .choice {
    position: relative; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px 10px;
    font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    transition: border-color .15s, background .15s;
  }
  .choice.text { align-items: flex-start; text-align: left; padding: 12px 14px; }
  .choice small { font-weight: 400; color: var(--muted); font-size: 13px; line-height: 1.35; }
  .choice .em { font-size: 28px; line-height: 1; }
  .choice:hover { border-color: var(--accent); }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .choice[aria-pressed="true"]::after {
    content: "✓"; position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-size: 12px; display: grid; place-items: center;
  }
  .kit .kit-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-right: 22px; }
  .kit .counts { font-size: 13px; color: var(--accent-dark); font-weight: 800; }
  .tag { font-size: 11px; font-weight: 800; background: var(--honey-soft); color: var(--honey-ink); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer;
  }
  .chip.small { padding: 4px 11px; font-size: 14px; }
  .chip:hover:not(:disabled) { border-color: var(--accent); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .ideas > span { color: var(--muted); font-size: 14px; margin-right: 2px; }

  .swatches { display: flex; gap: 4px; margin-top: 4px; }
  .sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--sw-line); display: inline-grid; place-items: center; font-size: 11px; }
  .sw.genie { background: var(--honey-soft); }
  .swatches.big .sw { width: 26px; height: 26px; }

  label.field { display: block; font-weight: 800; margin: 18px 0 6px; }
  label.field small { font-weight: 400; color: var(--muted); }
  input[type=text], textarea {
    width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; font: 16px "Nunito", sans-serif;
    color: var(--ink); background: var(--card);
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; }

  .radios { display: flex; flex-direction: column; gap: 10px; }
  .radio { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; cursor: pointer; }
  .radio input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); }
  .radio small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }

  .items, .pcards, .pieces { display: flex; flex-direction: column; gap: 10px; }
  .item, .pcard header { display: flex; gap: 14px; align-items: flex-start; }
  .item { border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; }
  .item.off { background: var(--soft-bg); }
  .item.off .item-body { opacity: .6; }
  .badge {
    flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-dark);
    display: grid; place-items: center; font-weight: 800;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-body small { display: block; color: var(--muted); font-size: 14px; }
  .opt { font-size: 11px; font-weight: 800; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
  .incl { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .incl input { width: 18px; height: 18px; accent-color: var(--accent); }

  .howto { background: var(--honey-soft); border-radius: 14px; padding: 14px 16px 14px 36px; margin: 12px 0 18px; }
  .howto li + li { margin-top: 6px; }
  .pcard { border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .pcard.is-done { background: var(--done-bg); border-color: var(--done-line); }
  .pcard.is-done .badge { background: var(--done-badge); color: var(--good); }
  .pcard.small header { align-items: center; }
  .pcard details { margin-top: 10px; }
  .pcard summary { cursor: pointer; font-weight: 700; color: var(--accent-dark); font-size: 14px; }
  .pcard pre {
    white-space: pre-wrap; word-wrap: break-word; font: 14px/1.55 "Nunito", sans-serif; background: var(--soft-bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin: 8px 0 0; max-height: 320px; overflow: auto;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pgroup { margin-top: 14px; }
  .pgroup > strong { display: block; margin-bottom: 6px; }
  .pieces { margin-top: 16px; }

  .btn {
    border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 800; cursor: pointer; text-decoration: none;
    background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: var(--accent-dark); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  .btn.secondary { background: var(--accent-soft); color: var(--accent-dark); }
  .btn.ghost { background: var(--card); color: var(--accent-dark); border: 2px solid var(--accent-soft); width: 100%; }
  .btn.ghost:hover { border-color: var(--accent); background: var(--card); }
  .link { border: 0; background: none; color: var(--accent-dark); font-weight: 800; cursor: pointer; padding: 8px 0; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
  .error { color: var(--accent-dark); font-weight: 800; margin: 14px 0 0; min-height: 0; }
  .error:empty { display: none; }

  aside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px; }
  @media (max-width: 880px) { aside { position: static; } }
  aside .panel { padding: 18px; }
  .sum-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sum-head h2 { margin: 0; font-size: 1.3rem; }
  .sum-head .tag { background: var(--accent-soft); color: var(--accent-dark); }
  dl { margin: 12px 0 0; }
  dt { font-size: 12px; color: var(--muted); margin-top: 12px; }
  dd { margin: 2px 0 0; }
  dd small { display: block; color: var(--muted); font-size: 13px; }
  .save details { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .save summary { cursor: pointer; font-weight: 800; color: var(--accent-dark); font-size: 14px; }
  .save p { font-size: 13px; color: var(--muted); margin: 6px 0; }
  .save input { font-size: 14px; padding: 9px 12px; }
  .ai-note { background: var(--honey-soft); border: 1px solid var(--honey-line); font-size: 13px; color: var(--honey-ink); display: flex; gap: 8px; }
  .ai-note::before { content: "✦"; color: var(--honey); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--toast-ink); padding: 10px 18px;
    border-radius: 999px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div class="top">
    <p class="brand">✨ Prompt Genie</p>
    <nav aria-label="Steps"><ol id="stepper"></ol></nav>
  </div>

  <div class="layout">
    <main class="panel" id="main"></main>

    <aside>
      <section class="panel" id="summary"></section>
      <section class="panel save">
        <a class="btn ghost" id="openChat" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT ↗</a>
        <details>
          <summary>Save my chat link (optional)</summary>
          <p>Keep all of a kit's images in one ChatGPT chat so they match. Paste that chat's web address here and the button above will take you straight back to it.</p>
          <input type="text" id="chatLink" data-field="chatLink" placeholder="https://chatgpt.com/c/…">
        </details>
      </section>
      <section class="panel ai-note" id="aiNote"></section>
    </aside>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script>document.getElementById("aiNote").append(window.GENIE_CONFIG.aiNote);</script>
  <script src="app.js"></script>
</body>
</html>
